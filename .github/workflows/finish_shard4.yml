name: Distributed Finish Shard 4 (8 Bots) & Final 5-Source Merge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'enrich_shard4.py'
      - '.github/workflows/finish_shard4.yml'

permissions:
  contents: write

jobs:
  enrich-shard4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl urllib3

      - name: Run Part ${{ matrix.part }} (Shard 4)
        run: |
          python enrich_shard4.py --part ${{ matrix.part }} --total-parts 8 --workers 4

      - name: Upload Part ${{ matrix.part }} Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-4-part-${{ matrix.part }}-csv
          path: shard_4_part_${{ matrix.part }}_enriched.csv

  merge-and-save:
    needs: enrich-shard4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Download all sub-shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize shard CSVs
        run: |
          find artifacts/ -name "shard_*.csv" -exec cp {} . \;
          ls -la shard_*.csv || true

      - name: Merge all shards into final 5-source Excel file
        run: |
          python merge_enriched.py

      - name: Commit and push final results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shard_*.csv || true
          git add Validated_content_added_enriched_5sources.xlsx || true
          git diff --staged --quiet || (git commit -m "Complete 100% 5-source corpus enrichment results [skip ci]" && git push)
