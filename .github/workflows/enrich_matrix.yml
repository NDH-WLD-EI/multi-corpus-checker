name: 5-Bot Multi-Source Corpus Enrichment (Rekhta & Shabdkosh)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'enrich_validate.py'
      - 'corpus_ready_for_enrichment.xlsx'
      - '.github/workflows/enrich_matrix.yml'

permissions:
  contents: write

jobs:
  enrich-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl urllib3

      - name: Run Shard ${{ matrix.shard }} Enrichment
        run: |
          python enrich_validate.py --shard-id ${{ matrix.shard }} --total-shards 5 --workers 3

      - name: Upload Shard ${{ matrix.shard }} Result Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-enriched-csv
          path: shard_${{ matrix.shard }}_enriched.csv

  merge-and-save:
    needs: enrich-shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install openpyxl

      - name: Download all shard CSV artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize shard CSVs
        run: |
          find artifacts/ -name "shard_*_enriched.csv" -exec cp {} . \;
          ls -l shard_*_enriched.csv || true

      - name: Merge all shards into final Excel file
        run: |
          python merge_enriched.py

      - name: Commit and push final results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shard_*_enriched.csv || true
          git add Validated_content_added_enriched_5sources.xlsx || true
          git diff --staged --quiet || (git commit -m "Complete 5-source corpus enrichment results [skip ci]" && git push)
